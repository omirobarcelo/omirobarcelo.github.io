<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Monedas de Krark</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<meta name="theme-color" content="#1a1a1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Krark">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #1a1a1f;
    --panel: #25252d;
    --border: #3a3a45;
    --text: #f0f0f5;
    --muted: #9a9aa8;
    --accent: #ffb84d;
    --heads: #ffb84d;
    --tails: #6a6a78;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    flex-direction: column;
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
  }

  header {
    padding: 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  h1 {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 12px;
    color: var(--accent);
  }

  .controls {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  label {
    font-size: 14px;
    color: var(--muted);
    flex: 1;
  }

  input[type="number"] {
    width: 90px;
    padding: 10px 12px;
    font-size: 16px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    text-align: center;
  }

  input[type="number"]:focus {
    outline: none;
    border-color: var(--accent);
  }

  .toggle {
    position: relative;
    display: inline-block;
    width: 48px;
    height: 28px;
    flex: 0 0 48px;
  }

  .toggle input { opacity: 0; width: 0; height: 0; }

  .slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background: var(--border);
    border-radius: 28px;
    transition: 0.2s;
  }

  .slider::before {
    content: "";
    position: absolute;
    height: 22px;
    width: 22px;
    left: 3px;
    bottom: 3px;
    background: var(--text);
    border-radius: 50%;
    transition: 0.2s;
  }

  .toggle input:checked + .slider {
    background: var(--accent);
  }

  .toggle input:checked + .slider::before {
    transform: translateX(20px);
    background: var(--bg);
  }

  button {
    padding: 12px;
    font-size: 16px;
    font-weight: 600;
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 4px;
  }

  button:active { transform: scale(0.98); }

  .summary {
    padding: 14px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    font-size: 15px;
    color: var(--muted);
    text-align: center;
  }

  .summary .count {
    color: var(--accent);
    font-size: 18px;
    font-weight: 700;
  }

  .results {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
  }

  .flip-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .flip-row {
    display: flex;
    justify-content: center;
    gap: 12px;
  }

  .flip-row.pair {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px;
  }

  .flip-row.pair.skipped {
    opacity: 0.4;
    border-style: dashed;
  }

  .coin {
    width: 44px;
    height: 44px;
    flex-shrink: 0;
  }

  .empty {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 40px 16px;
  }
</style>
</head>
<body>
  <header>
    <h1>Monedas de Krark</h1>
    <div class="controls">
      <div class="row">
        <label for="count">Número de monedas</label>
        <input id="count" type="number" min="1" max="500" value="10">
      </div>
      <div class="row">
        <label for="duplicated">Duplicadas (lanzar parejas)</label>
        <label class="toggle">
          <input id="duplicated" type="checkbox">
          <span class="slider"></span>
        </label>
      </div>
      <button id="flip">Lanzar</button>
    </div>
  </header>

  <div id="summary" class="summary"></div>

  <main class="results">
    <div id="output" class="flip-list">
      <div class="empty">Pulsa Lanzar para empezar</div>
    </div>
  </main>

<script>
  const SVG_NS = 'http://www.w3.org/2000/svg';

  function coinHeads() {
    const svg = document.createElementNS(SVG_NS, 'svg');
    svg.setAttribute('viewBox', '0 0 44 44');
    svg.setAttribute('class', 'coin');
    const circle = document.createElementNS(SVG_NS, 'circle');
    circle.setAttribute('cx', '22');
    circle.setAttribute('cy', '22');
    circle.setAttribute('r', '16');
    circle.setAttribute('fill', 'none');
    circle.setAttribute('stroke', 'var(--heads)');
    circle.setAttribute('stroke-width', '3.5');
    svg.appendChild(circle);
    return svg;
  }

  function coinTails() {
    const svg = document.createElementNS(SVG_NS, 'svg');
    svg.setAttribute('viewBox', '0 0 44 44');
    svg.setAttribute('class', 'coin');
    const makeLine = (x1, y1, x2, y2) => {
      const line = document.createElementNS(SVG_NS, 'line');
      line.setAttribute('x1', x1);
      line.setAttribute('y1', y1);
      line.setAttribute('x2', x2);
      line.setAttribute('y2', y2);
      line.setAttribute('stroke', 'var(--tails)');
      line.setAttribute('stroke-width', '3.5');
      line.setAttribute('stroke-linecap', 'round');
      return line;
    };
    svg.appendChild(makeLine(10, 10, 34, 34));
    svg.appendChild(makeLine(34, 10, 10, 34));
    return svg;
  }

  function coin(isHeads) {
    return isHeads ? coinHeads() : coinTails();
  }

  function flipOne() {
    return Math.random() < 0.5;
  }

  function setSummary(headsCount, pairsCount) {
    const summary = document.getElementById('summary');
    summary.replaceChildren();
    const countEl = document.createElement('span');
    countEl.className = 'count';
    countEl.textContent = String(headsCount);
    summary.appendChild(countEl);
    const label = headsCount === 1 ? ' cara' : ' caras';
    if (pairsCount == null) {
      summary.appendChild(document.createTextNode(label));
    } else {
      const pairLabel = pairsCount === 1 ? 'pareja' : 'parejas';
      summary.appendChild(document.createTextNode(`${label} (${pairsCount} ${pairLabel})`));
    }
  }

  function render() {
    const rawCount = parseInt(document.getElementById('count').value, 10);
    const count = Math.max(1, Math.min(500, isNaN(rawCount) ? 1 : rawCount));
    const duplicated = document.getElementById('duplicated').checked;
    const output = document.getElementById('output');
    output.replaceChildren();

    if (duplicated) {
      const pairs = [];
      for (let i = 0; i < count; i++) {
        pairs.push([flipOne(), flipOne()]);
      }

      const firstMixedIdx = pairs.findIndex(([a, b]) => a !== b);
      let heads = 0;

      pairs.forEach(([a, b], idx) => {
        const isMixed = a !== b;
        const skipped = isMixed && idx === firstMixedIdx;
        const pairHasHeads = a || b;
        if (pairHasHeads && !skipped) heads++;

        const row = document.createElement('div');
        row.className = 'flip-row pair' + (skipped ? ' skipped' : '');
        row.appendChild(coin(a));
        row.appendChild(coin(b));
        output.appendChild(row);
      });

      setSummary(heads, pairs.length);
    } else {
      let heads = 0;
      for (let i = 0; i < count; i++) {
        const h = flipOne();
        if (h) heads++;
        const row = document.createElement('div');
        row.className = 'flip-row';
        row.appendChild(coin(h));
        output.appendChild(row);
      }
      setSummary(heads, null);
    }
  }

  document.getElementById('flip').addEventListener('click', render);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
